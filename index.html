<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý người dùng</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; font-size: 14px; }
  th { background: #f0f0f0; }
  button { margin-right: 4px; cursor: pointer; }
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 999; }
  .modal-content { background: #fff; padding: 6px 14px 14px; border-radius: 6px; width: 300px; }
  .modal-content label { display: block; margin-top: 6px; }
  .modal-content input { width: 100%; box-sizing: border-box; }
  .toolbar { display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function SearchForm({ onChangeValue }) {
  return (
    <input type="text" placeholder="Tìm theo name, username"
      onChange={(e) => onChangeValue(e.target.value)} />
  );
}

const emptyUser = () => ({ name: "", username: "", email: "",
  address: { street: "", suite: "", city: "" }, phone: "", website: "" });

function AddUser({ onAdd }) {
  const [adding, setAdding] = React.useState(false);
  const [user, setUser] = React.useState(emptyUser());

  const handleChange = (e) => {
    const { id, value } = e.target;
    if (["street", "suite", "city"].includes(id)) {
      setUser({ ...user, address: { ...user.address, [id]: value } });
    } else {
      setUser({ ...user, [id]: value });
    }
  };
  const handleAdd = () => {
    if (user.name === "" || user.username === "") {
      alert("Vui lòng nhập Name và Username!");
      return;
    }
    onAdd(user);
    setUser(emptyUser());
    setAdding(false);
  };
  return (
    <div>
      <button onClick={() => setAdding(true)}>Thêm</button>
      {adding && (
        <div className="modal-overlay">
          <div className="modal-content">
            <h4>Thêm người dùng</h4>
            <label htmlFor="name">Name:</label>
            <input id="name" type="text" value={user.name} onChange={handleChange} />
            <label htmlFor="username">Username:</label>
            <input id="username" type="text" value={user.username} onChange={handleChange} />
            <label htmlFor="email">Email:</label>
            <input id="email" type="text" value={user.email} onChange={handleChange} />
            <label htmlFor="street">Street:</label>
            <input id="street" type="text" value={user.address.street} onChange={handleChange} />
            <label htmlFor="suite">Suite:</label>
            <input id="suite" type="text" value={user.address.suite} onChange={handleChange} />
            <label htmlFor="city">City:</label>
            <input id="city" type="text" value={user.address.city} onChange={handleChange} />
            <label htmlFor="phone">Phone:</label>
            <input id="phone" type="text" value={user.phone} onChange={handleChange} />
            <p>
              <button onClick={handleAdd}>Thêm</button>
              <button onClick={() => setAdding(false)}>Hủy</button>
            </p>
          </div>
        </div>
      )}
    </div>
  );
}

function ResultTable({ keyword, user, onAdded }) {
  const [users, setUsers] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [editing, setEditing] = React.useState(null);

  React.useEffect(() => {
    fetch("https://jsonplaceholder.typicode.com/users")
      .then(res => res.json())
      .then(data => { setUsers(data); setLoading(false); });
  }, []);

  React.useEffect(() => {
    if (user) {
      setUsers((prev) => [...prev, { ...user, id: Math.max(0, ...prev.map(u => u.id)) + 1 }]);
      onAdded();
    }
  }, [user]);

  const filteredUsers = users.filter((u) =>
    u.name.toLowerCase().includes(keyword.toLowerCase()) ||
    u.username.toLowerCase().includes(keyword.toLowerCase()));

  function editUser(u) { setEditing({ ...u, address: { ...u.address } }); }
  function handleEditChange(field, value) {
    if (["street", "suite", "city"].includes(field)) {
      setEditing({ ...editing, address: { ...editing.address, [field]: value } });
    } else {
      setEditing({ ...editing, [field]: value });
    }
  }
  function saveUser() {
    setUsers(prev => prev.map(u => u.id === editing.id ? editing : u));
    setEditing(null);
  }
  function removeUser(id) { setUsers((prev) => prev.filter((u) => u.id != id)); }

  if (loading) return <p>Đang tải dữ liệu...</p>;
  return (
    <div>
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Username</th><th>Email</th><th>Address</th><th>Phone</th><th>Hành động</th></tr>
        </thead>
        <tbody>
          {filteredUsers.map((u) => (
            <tr key={u.id}>
              <td>{u.id}</td><td>{u.name}</td><td>{u.username}</td><td>{u.email}</td>
              <td>{u.address.street}, {u.address.suite}, {u.address.city}</td>
              <td>{u.phone}</td>
              <td>
                <button onClick={() => editUser(u)}>Sửa</button>
                <button onClick={() => removeUser(u.id)}>Xóa</button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      {editing && (
        <div className="modal-overlay">
          <div className="modal-content">
            <h4>Sửa người dùng #{editing.id}</h4>
            <label htmlFor="e-name">Name</label>
            <input id="e-name" type="text" value={editing.name} onChange={(e) => handleEditChange("name", e.target.value)} />
            <label htmlFor="e-username">Username</label>
            <input id="e-username" type="text" value={editing.username} onChange={(e) => handleEditChange("username", e.target.value)} />
            <label htmlFor="e-email">Email</label>
            <input id="e-email" type="text" value={editing.email} onChange={(e) => handleEditChange("email", e.target.value)} />
            <label htmlFor="e-street">Street</label>
            <input id="e-street" type="text" value={editing.address.street} onChange={(e) => handleEditChange("street", e.target.value)} />
            <label htmlFor="e-suite">Suite</label>
            <input id="e-suite" type="text" value={editing.address.suite} onChange={(e) => handleEditChange("suite", e.target.value)} />
            <label htmlFor="e-city">City</label>
            <input id="e-city" type="text" value={editing.address.city} onChange={(e) => handleEditChange("city", e.target.value)} />
            <label htmlFor="e-phone">Phone</label>
            <input id="e-phone" type="text" value={editing.phone} onChange={(e) => handleEditChange("phone", e.target.value)} />
            <p>
              <button onClick={saveUser}>Lưu</button>
              <button onClick={() => setEditing(null)}>Hủy</button>
            </p>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [kw, setKeyword] = React.useState("");
  const [newUser, setNewUser] = React.useState(null);
  return (
    <div>
      <h1>Quản lý người dùng</h1>
      <div className="toolbar">
        <SearchForm onChangeValue={setKeyword} />
        <AddUser onAdd={setNewUser} />
      </div>
      <ResultTable keyword={kw} user={newUser} onAdded={() => setNewUser(null)} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
